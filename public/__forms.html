<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!--
  Netlify Forms definitions. Netlify scans this file at deploy time to register
  each form and its fields; the React forms post their submissions here.
  Keep the field names in sync with lib/forms.ts.
-->
<form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote">
  <input name="bot-field">
  <input name="name"><input name="phone"><input name="email"><input name="postcode">
  <select name="client_type"></select><select name="service"></select><select name="urgency"></select>
  <textarea name="message"></textarea>
</form>
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact">
  <input name="bot-field">
  <input name="name"><input name="phone"><input name="email">
  <textarea name="message"></textarea>
</form>
<form name="subcontractor-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="subcontractor-application">
  <input name="bot-field">
  <input name="subject">
  <input name="business_name"><input name="business_type"><input name="company_number">
  <input name="contact_name"><input name="mobile"><input name="email">
  <textarea name="business_address"></textarea><input name="years_trading"><input name="website">
  <input name="trades"><input name="areas"><input name="availability"><input name="team_size"><input name="own_van_tools">
  <input name="day_rate"><input name="hourly_rate"><input name="callout_charge"><input name="emergency_rate">
  <textarea name="rates_notes"></textarea>
  <input name="pl_insurer"><input name="pl_cover"><input name="pl_expiry"><input name="employs_staff"><input name="el_expiry">
  <input name="utr"><input name="cis_status"><input name="vat_registered"><input name="vat_number">
  <input name="share_code"><input name="dbs"><input name="rams"><input name="references">
  <input name="declarations">
  <textarea name="documents"></textarea>
  <textarea name="summary"></textarea>
</form>
<form name="referral" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="referral">
  <input name="bot-field">
  <input name="your_name"><input name="your_email"><input name="referral_name"><input name="referral_contact">
  <textarea name="message"></textarea>
</form>
<form name="property-mot" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="property-mot">
  <input name="bot-field">
  <input name="subject">
  <input name="visit_type"><input name="property_type"><input name="hmo_rooms">
  <input name="addons"><input name="partner_services"><input name="regular_checks">
  <input name="guide_price"><input name="partner_from_subtotal">
  <input name="client_type"><input name="name"><input name="company"><input name="mobile"><input name="email">
  <input name="door_number"><input name="street"><input name="town"><input name="postcode">
  <input name="preferred_dates"><textarea name="access_notes"></textarea>
  <input name="agency_name"><input name="report_and_invoice_to">
  <textarea name="summary"></textarea>
</form>
</body>
</html>
